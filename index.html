<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4eee4">
  <title>Akram & Theresa-Belle — Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f4eee5;
      color:#302820;
      font-family:"DM Sans",sans-serif;
      padding:20px;
    }
    .language-box{
      width:min(560px,100%);
      text-align:center;
      padding:58px 30px;
      background:#fffaf4;
      border:1px solid #d9c8b4;
      box-shadow:0 22px 55px rgba(74,56,38,.14);
    }
    .kicker{
      font-size:10px;
      letter-spacing:.28em;
      text-transform:uppercase;
      color:#8d7761;
    }
    h1{
      font-family:"Cormorant Garamond",serif;
      font-size:58px;
      line-height:.96;
      font-weight:500;
      margin:20px 0 12px;
    }
    h1 span{display:block;color:#987b60}
    .date{
      font-family:"Cormorant Garamond",serif;
      font-size:25px;
      color:#987b60;
    }
    .choose{
      margin:34px 0 20px;
      color:#7e7369;
      font-size:14px;
    }
    .languages{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }
    .language-btn{
      padding:16px 10px;
      border:1px solid #a98d70;
      color:#745e49;
      background:#fff;
      text-decoration:none;
      font-size:13px;
      letter-spacing:.12em;
      transition:.25s;
    }
    .language-btn:hover{background:#8b7259;color:#fff}
    @media(max-width:480px){
      h1{font-size:46px}
      .languages{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="language-box">
    <div class="kicker">Wedding Invitation</div>
    <h1>Akram <span>& Theresa-Belle</span></h1>
    <div class="date">10 · 10 · 2026</div>
    <div class="choose">Choose your language / اختر اللغة</div>

    <div class="languages">
      <a href="en.html" id="englishBtn" class="language-btn">English</a>
      <a href="ar.html" id="arabicBtn" class="language-btn">العربية</a>
    </div>
  </div>

  <script>
    const params = window.location.search;
    document.getElementById("englishBtn").href = "en.html" + params;
    document.getElementById("arabicBtn").href = "ar.html" + params;
  </script>
</body>
</html>
